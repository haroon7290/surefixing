# One-off: is the live backend / website running the latest version?
name: Diagnose live
on:
  push:
    branches: ["claude/**"]
    paths: [".github/workflows/diagnose-live.yml"]
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check
        run: |
          API=https://surefix-api.onrender.com
          echo "== health"; curl -s --max-time 90 $API/api/health; echo
          TOKEN=$(curl -s --max-time 60 -X POST $API/api/auth/login -H 'Content-Type: application/json' -d '{"email":"client@demo.com","password":"password123"}' | python3 -c "import json,sys;print(json.load(sys.stdin).get('token',''))")
          echo "== jobs (number, title)"
          curl -s --max-time 60 "$API/api/jobs?limit=5" -H "Authorization: Bearer $TOKEN" | python3 -c "import json,sys; d=json.load(sys.stdin); print([(j.get('number'), j.get('title')) for j in d] if isinstance(d,list) else d)"
          echo "== search 1001"
          curl -s --max-time 60 "$API/api/jobs?q=SF-1001" -H "Authorization: Bearer $TOKEN" | python3 -c "import json,sys; d=json.load(sys.stdin); print(len(d) if isinstance(d,list) else d)"
          echo "== website build contains job numbers code?"
          curl -s --max-time 60 https://haroon7290.github.io/surefixing/main.dart.js | grep -c "copied" || true
          curl -sI --max-time 60 https://haroon7290.github.io/surefixing/main.dart.js | grep -i "last-modified\|age:" || true
