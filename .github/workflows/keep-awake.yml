# Render's free plan puts the backend to sleep after 15 minutes without
# traffic, and the next visitor then waits ~50 seconds. Pinging the health
# check every 10 minutes keeps it awake. (GitHub may run scheduled jobs a
# few minutes late; for a guaranteed 5-minute ping use a free monitor such
# as UptimeRobot on the same address.)
name: Keep backend awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping the backend
        run: |
          url="${{ vars.API_BASE_URL || 'https://surefix-api.onrender.com' }}/api/health"
          for i in 1 2 3; do
            if curl -fsS --max-time 90 "$url"; then echo; exit 0; fi
            sleep 10
          done
          echo "Backend did not answer at $url"
          exit 1
