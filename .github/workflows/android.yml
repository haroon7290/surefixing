# Builds the Android app (APK) that talks to the live backend, on every push
# to main that changes the app, and on demand. Download it from the run's
# "Artifacts" section (Actions → Android app → latest run) and install it.
# Uses the same repository variables as the website: API_BASE_URL and DEMO.
name: Android app

on:
  push:
    branches: [main]
    paths: ["mobile/**", ".github/workflows/android.yml"]
  workflow_dispatch:

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.7"
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build
        run: >
          flutter build apk --release
          --dart-define=API_BASE_URL=${{ vars.API_BASE_URL || 'https://surefix-api.onrender.com' }}
          --dart-define=DEMO=${{ vars.DEMO || 'false' }}
      - uses: actions/upload-artifact@v4
        with:
          name: surefix-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
