name: Probe live forgot-password
on:
  push:
    branches: ["claude/**"]
    paths: [".github/workflows/probe.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for i in $(seq 1 20); do
            out=$(curl -s -m 90 -X POST https://surefix-api.onrender.com/api/auth/forgot-password -H 'Content-Type: application/json' -d '{"email":"nobody-probe-123@example.com"}')
            echo "$out"
            echo "$out" | grep -q '"method":"link"' && exit 0
            sleep 30
          done
          exit 1
