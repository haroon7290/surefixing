<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    If you serve the site from a sub-path, pass it at build time:
      flutter build web --base-href /surefix/
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="SureFix — home repairs from verified technicians and tools to rent, with payments protected by escrow.">
  <meta name="theme-color" content="#F6F3EE" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0D0E11" media="(prefers-color-scheme: dark)">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="SureFix">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/svg+xml" href="icons/mark.svg">
  <link rel="icon" type="image/png" href="favicon.png">

  <title>SureFix — home repairs and tool rentals</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Shown until Flutter paints its first frame. */
    html, body { height: 100%; margin: 0; background: #F6F3EE; }
    #splash { position: fixed; inset: 0; display: grid; place-items: center; background: #F6F3EE; transition: opacity .25s ease; }
    #splash img { width: 84px; height: 84px; animation: pulse 1.4s ease-in-out infinite; }
    @keyframes pulse { 50% { transform: scale(.92); opacity: .75; } }
    @media (prefers-color-scheme: dark) { html, body, #splash { background: #0D0E11; } }
    @media (prefers-reduced-motion: reduce) { #splash img { animation: none; } }
  </style>
</head>
<body>
  <div id="splash"><img src="icons/mark.svg" alt="SureFix is loading"></div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('splash');
      if (!splash) return;
      splash.style.opacity = '0';
      setTimeout(function () { splash.remove(); }, 300);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
